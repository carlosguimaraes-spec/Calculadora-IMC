<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC para Adultos</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-white border-b border-slate-200 py-6 px-4 shadow-sm">
        <div class="max-w-md mx-auto text-center">
            <h1 class="text-2xl font-bold text-indigo-600">Calculadora de IMC</h1>
            <p class="text-sm text-slate-500 mt-1">Avaliação do Índice de Massa Corporal para Adultos</p>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto p-4 sm:p-6 my-auto">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6">
            
            <form id="imcForm" class="space-y-4" onsubmit="event.preventDefault(); calcularIMC();">
                <div>
                    <label for="peso" class="block text-sm font-medium text-slate-700 mb-1">Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" min="10" max="300" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-lg"
                           placeholder="Ex: 70.5">
                </div>

                <div>
                    <label for="altura" class="block text-sm font-medium text-slate-700 mb-1">Altura (cm)</label>
                    <input type="number" id="altura" step="1" min="50" max="250" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-lg"
                           placeholder="Ex: 175">
                    <span class="text-xs text-slate-400 mt-1 block">Insira sua altura em centímetros (ex: 175)</span>
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition">
                    Calcular IMC
                </button>
            </form>

            <div id="resultadoContainer" class="hidden mt-6 pt-6 border-t border-slate-100 transition-all">
                <div class="text-center">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Seu IMC</span>
                    <div id="imcValor" class="text-4xl font-extrabold text-slate-900 my-1">--</div>
                    <div id="imcClassificacao" class="inline-block px-3 py-1 rounded-full text-sm font-medium mt-1">--</div>
                </div>

                <div id="projecaoObesidade" class="hidden mt-5 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900">
                    <h3 class="font-bold flex items-center gap-1.5 mb-2 text-amber-800">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Projeção para os Graus de Obesidade:
                    </h3>
                    <ul id="listaProjecao" class="space-y-1.5 text-xs sm:text-sm font-medium">
                        <!-- Populated by JavaScript -->
                    </ul>
                </div>
            </div>

            <div id="customAlert" class="hidden mt-4 bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm"></div>

        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-auto bg-white">
        Calculadora de IMC para adultos com base nos critérios da OMS.
    </footer>

    <script>
        function showAlert(msg) {
            const alertBox = document.getElementById('customAlert');
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden');
            document.getElementById('resultadoContainer').classList.add('hidden');
        }

        function hideAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function calcularIMC() {
            hideAlert();
            
            const pesoInput = document.getElementById('peso').value.replace(',', '.');
            const alturaCmInput = document.getElementById('altura').value.replace(',', '.');

            const peso = parseFloat(pesoInput);
            const alturaCm = parseFloat(alturaCmInput);

            if (isNaN(peso) || isNaN(alturaCm) || peso <= 0 || alturaCm <= 0) {
                showAlert('Por favor, insira valores válidos para peso e altura.');
                return;
            }

            // Converter altura de centímetros para metros
            const altura = alturaCm / 100;

            const imc = peso / (altura * altura);
            const imcFormatado = imc.toFixed(1);

            let classificacao = '';
            let corClasse = '';
            let mostrarProjecao = false;

            if (imc < 18.5) {
                classificacao = 'Abaixo do peso';
                corClasse = 'bg-blue-100 text-blue-800';
            } else if (imc >= 18.5 && imc < 25) {
                classificacao = 'Peso normal (Eutrofia)';
                corClasse = 'bg-emerald-100 text-emerald-800';
                mostrarProjecao = true;
            } else if (imc >= 25 && imc < 30) {
                classificacao = 'Sobrepeso';
                corClasse = 'bg-yellow-100 text-yellow-800';
                mostrarProjecao = true;
            } else if (imc >= 30 && imc < 35) {
                classificacao = 'Obesidade Grau I';
                corClasse = 'bg-orange-100 text-orange-800';
            } else if (imc >= 35 && imc < 40) {
                classificacao = 'Obesidade Grau II';
                corClasse = 'bg-red-100 text-red-800';
            } else {
                classificacao = 'Obesidade Grau III (Mórbida)';
                corClasse = 'bg-purple-100 text-purple-800';
            }

            document.getElementById('imcValor').innerText = imcFormatado;
            const badge = document.getElementById('imcClassificacao');
            badge.innerText = classificacao;
            badge.className = `inline-block px-3 py-1 rounded-full text-sm font-medium mt-1 ${corClasse}`;

            const projecaoDiv = document.getElementById('projecaoObesidade');
            
            if (mostrarProjecao) {
                // Cálculo de quanto falta para atingir os limiares exatos (IMC 30, 35 e 40)
                const pesoGrau1 = 30 * (altura * altura);
                const pesoGrau2 = 35 * (altura * altura);
                const pesoGrau3 = 40 * (altura * altura);

                const faltaGrau1 = (pesoGrau1 - peso).toFixed(1);
                const faltaGrau2 = (pesoGrau2 - peso).toFixed(1);
                const faltaGrau3 = (pesoGrau3 - peso).toFixed(1);

                const lista = document.getElementById('listaProjecao');
                lista.innerHTML = `
                    <li class="flex justify-between border-b border-amber-200/60 pb-1">
                        <span>Para atingir a obesidade grau I falta:</span>
                        <span class="text-amber-950 font-bold">${faltaGrau1} kg</span>
                    </li>
                    <li class="flex justify-between border-b border-amber-200/60 py-1">
                        <span>Para atingir a obesidade grau II falta:</span>
                        <span class="text-amber-950 font-bold">${faltaGrau2} kg</span>
                    </li>
                    <li class="flex justify-between pt-1">
                        <span>Para atingir a obesidade grau III falta:</span>
                        <span class="text-amber-950 font-bold">${faltaGrau3} kg</span>
                    </li>
                `;
                projecaoDiv.classList.remove('hidden');
            } else {
                projecaoDiv.classList.add('hidden');
            }

            document.getElementById('resultadoContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
